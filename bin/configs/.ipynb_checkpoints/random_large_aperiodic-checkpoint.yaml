########## parameters for the GMRES solver ##########
max_iter: 500
tol: 1e-4 # relative residual target
verbose: True
restart: 20 # if == 0, no restart, otherwise, run restarted GMRES

########## other configs ##########
spins_verification: 0 # if 1, run simulation in spins as well to verify the results
save_for_plotting: 1 # if 1, save the field distributions
return_xr_history: 0
plot_iters: None

plot_farfield: 0 # if 1, plot far-field patterns using Stratton-Chu
physics_verification: 0 # if 1, run physics verification tests